server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre: se pueden cachear para siempre
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    # Capturas: no llevan hash en el nombre, así que caché acotada
    location /shots/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Sin cabeceras que delaten la versión
    server_tokens off;
}
